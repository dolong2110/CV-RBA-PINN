name: CV-RBA-PINN Verification & Unit Tests

on:
  workflow_dispatch:

env:
  MPLBACKEND: Agg

jobs:
  verify-gates-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install CPU PyTorch & scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy matplotlib pyarrow

      - name: Run full analytic PDE gates, Fourier/ADI parity, and CLI unit test suite
        run: python -m unittest discover -s tests -v
